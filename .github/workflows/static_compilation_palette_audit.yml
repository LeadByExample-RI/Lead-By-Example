name: Static Compilation & Palette Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Audit (build, typecheck, lint, palette)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run forbidden selector check
        run: npm run check:forbidden-selectors

      - name: Run production build
        run: npm run vercel-build

      - name: Type check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: |
          if npm run | grep -q "test"; then
            npm test --if-present
          else
            echo "No test script defined; skipping";
          fi
